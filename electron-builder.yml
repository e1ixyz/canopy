appId: dev.orchestrator.app
productName: Canopy
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
mac:
  category: public.app-category.developer-tools
  target: dir
  identity: null
  icon: build/icon.icns
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg
afterPack: scripts/after-pack.cjs
